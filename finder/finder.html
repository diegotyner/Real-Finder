<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Song Finder</title>
    <style>
      #resultsContainer {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .resultBox {
        flex: 1;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 6px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Song Finder</h1>
    <input id="searchBox" type="text" placeholder="Search for a song..." />

    <div id="resultsContainer">
      <div class="resultBox">
        <h2>Exact Matches</h2>
        <ul id="exactResults"></ul>
      </div>
      <div class="resultBox">
        <h2>Fuzzy Matches</h2>
        <ul id="fuzzyResults"></ul>
      </div>
    </div>

    <!-- Load the data -->
    <script src="songs.js"></script>
    <!-- Fuse.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.js"></script>

    <script>
      function titleCase(str) {
        var splitStr = str.toLowerCase().split(" ");
        for (var i = 0; i < splitStr.length; i++) {
          // You do not need to check if i is larger than splitStr length, as your for does that for you
          // Assign it back to the array
          splitStr[i] =
            splitStr[i].charAt(0).toUpperCase() + splitStr[i].substring(1);
        }
        // Directly return the joined string
        return splitStr.join(" ");
      }

      const jrb_loc = "Jazz_Real_Book.pdf";

      const input = document.getElementById("searchBox");
      const exactResults = document.getElementById("exactResults");
      const fuzzyResults = document.getElementById("fuzzyResults");

      // Fuse.js setup (normalize to lowercase)
      const fuse = new Fuse(
        songs.map((s) => ({
          ...s,
          song_name: s.song_name.toLowerCase(),
        })),
        {
          keys: ["song_name"],
          includeScore: true,
        },
      );

      input.addEventListener("input", () => {
        const query = input.value.toLowerCase();
        exactResults.innerHTML = "";
        fuzzyResults.innerHTML = "";

        if (!query) return;

        // Exact matches
        const matches = songs.filter((song) =>
          song.song_name.toLowerCase().includes(query),
        );

        matches.slice(0, 20).forEach((song) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `${jrb_loc}#page=${song.page_num - 1}`;
          a.target = "_blank"; // open in new tab
          a.textContent = `${titleCase(song.song_name)} (p.${song.page_num})`;
          li.appendChild(a);
          exactResults.appendChild(li);
        });

        // Fuzzy matches
        const fuzzyMatches = fuse.search(query);

        fuzzyMatches.slice(0, 20).forEach((result) => {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = `${jrb_loc}#page=${result.item.page_num - 1}`;
          a.target = "_blank";
          a.textContent = `${titleCase(result.item.song_name)} (p.${result.item.page_num}) [score: ${result.score.toFixed(2)}]`;
          li.appendChild(a);
          fuzzyResults.appendChild(li);
        });
      });
    </script>
  </body>
</html>
